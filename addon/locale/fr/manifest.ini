summary = "Assistance à distance TeleNVDA"
description = """Permet le contrôle et l'accès à distance à un autre ordinateur. Cette extension est basée sur l'Accès distant NVDA."""
changelog = """Corriger les mises à jour automatiques qui ne se terminaient pas avec une erreur « accès refusé », récupérer les installations bloquées en attente, ajouter les connexions aux relais WebSocket via HTTPS, notamment sur le port 443, l'authentification SSPI de Windows pour les proxys HTTP NTLM et Kerberos, améliorer la compatibilité avec les proxys et fournir deux méthodes de capture d'écran distante."""
