summary = "TeleNVDA-Fernunterstützung"
description = """Stellt einen Zugriff von und auf einen anderen Computer her. Diese NVDA-Erweiterung basiert auf NVDA-Remote."""
changelog = """Beheben Sie automatische Updates, die mit dem Fehler „Zugriff verweigert“ nicht abgeschlossen werden konnten, stellen Sie ausstehende Installationen wieder her, fügen Sie WebSocket-Relay-Verbindungen über HTTPS, einschließlich Port 443, hinzu, fügen Sie Windows SSPI-Authentifizierung für NTLM- und Kerberos-HTTP-Proxys hinzu, verbessern Sie die Proxy-Kompatibilität und stellen Sie zwei Remote-Screenshot-Methoden bereit."""
