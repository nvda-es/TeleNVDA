summary = "Tele NVDA uzaktan Destek"
description = """Başka bir makinenin uzaktan kontrolüne ve uzaktan erişime izin verir. Bu eklenti, NVDA Remote'a dayanmaktadır."""
changelog = """"Erişim reddedildi" hatasıyla tamamlanamayan otomatik güncellemeleri düzeltin, beklemede kalan kurulumları kurtarın, 443 numaralı bağlantı noktası da dahil olmak üzere HTTPS üzerinden WebSocket geçiş bağlantıları ekleyin, NTLM ve Kerberos HTTP proxy'leri için Windows SSPI kimlik doğrulaması ekleyin, proxy uyumluluğunu iyileştirin ve iki uzaktan ekran görüntüsü yöntemi sağlayın."""
