summary = "Дистанционна помощ чрез Tele NVDA (Tele NVDA remote assistance)"
description = """Позволява дистанционно управление и отдалечен достъп до друга машина. Тази добавка е базирана на NVDA Remote."""
changelog = """Коригирайте автоматичните актуализации, които не успяха да завършат с грешка „достъпът е отказан“, възстановете инсталациите, блокирани в очакване, добавете WebSocket релейни връзки през HTTPS, включително порт 443, добавете Windows SSPI удостоверяване за NTLM и Kerberos HTTP проксита, подобрете съвместимостта на прокси сървъра и осигурете два отдалечени метода за скрийншот."""
