summary = "Tele NVDA -etätuki"
description = """Tämän lisäosan avulla konettasi voidaan käyttää etänä ja voit etäkäyttää toista konetta. Perustuu NVDA-etäkäyttö-lisäosaan."""
changelog = """Korjaa automaattiset päivitykset, jotka epäonnistuivat "pääsy estetty" -virheen vuoksi, palauta odottavat asennukset, lisää WebSocket-välitysyhteydet HTTPS:n kautta, mukaan lukien portti 443, lisää Windowsin SSPI-todennus NTLM- ja Kerberos HTTP-välityspalvelimille, paranna välityspalvelinyhteensopivuutta ja tarjoa kaksi etäkuvakaappausmenetelmää."""
