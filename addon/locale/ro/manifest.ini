summary = "Asistență la distanță Tele NVDA"
description = """Permite controlul calculatoarelor de la distanță. Acest supliment este bazat pe NVDA Remote."""
changelog = """Remediați actualizările automate care nu s-au finalizat cu o eroare „acces refuzat”, recuperați instalările blocate în așteptare, adăugați conexiuni de retransmisie WebSocket prin HTTPS, inclusiv portul 443, adăugați autentificare Windows SSPI pentru proxy-urile HTTP NTLM și Kerberos, îmbunătățiți compatibilitatea proxy și furnizați două metode de captură de ecran la distanță."""
