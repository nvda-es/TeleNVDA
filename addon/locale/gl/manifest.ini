summary = "Asistencia remota TeleNVDA"
description = """Permite o control e o aceso remoto a outro equipo. Este complemento está baseado en NVDA Remote."""
changelog = """Corrixir actualizacións automáticas que non se completaron cun erro de "acceso denegado", recuperar instalacións atascadas pendentes, engadir conexións de retransmisión de WebSocket a través de HTTPS, incluído o porto 443, engadir autenticación SSPI de Windows para proxies HTTP NTLM e Kerberos, mellorar a compatibilidade do proxy e proporcionar dous métodos de captura de pantalla remotas."""
