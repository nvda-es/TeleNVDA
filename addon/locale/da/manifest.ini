summary = "Tele NVDA fjernsupport"
description = """Tillader fjernstyring af og fjernadgang til en anden maskine. Denne tilføjelse er baseret på NVDA Fjernsupport (NVDA Remote)."""
changelog = """Ret automatiske opdateringer, der ikke kunne fuldføres med en "adgang nægtet"-fejl, gendan installationer, der sidder fast, tilføj WebSocket-relæforbindelser over HTTPS, inklusive port 443, tilføj Windows SSPI-godkendelse til NTLM- og Kerberos HTTP-proxyer, forbedrer proxykompatibilitet og giv to metoder til fjernskærmbilleder."""
