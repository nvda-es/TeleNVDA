summary = "Tele NVDA remote assistance (Удалённая помощь Tele NVDA)"
description = """Это дополнение позволяет осуществлять сеансы удалённого управления между различными компьютерами. Оно основано на дополнении NVDA Remote."""
changelog = """Исправьте автоматические обновления, которые не удалось завершить из-за ошибки «отказано в доступе», восстановите зависшие установки, добавьте ретрансляционные соединения WebSocket через HTTPS, включая порт 443, добавьте аутентификацию Windows SSPI для прокси-серверов NTLM и Kerberos HTTP, улучшите совместимость прокси-серверов и предоставьте два метода удаленного создания снимков экрана."""
