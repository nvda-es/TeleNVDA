summary = "دستیارِ راهِ دورِ TeleNVDA"
description = """اجازه میدهد رایانه‌ای بتواند رایانه‌ی دیگری را کنترل یا به آن دسترسی پیدا کند. این افزونه بر اساس NVDA Remote نوشته شده است."""
changelog = """اصلاح به‌روزرسانی‌های خودکار که با خطای «دسترسی ممنوع» تکمیل نشدند، نصب‌های معلق بازیابی شدند، اتصالات رله WebSocket را از طریق HTTPS از جمله پورت 443 اضافه کنید، تأیید اعتبار Windows SSPI را برای پراکسی‌های NTLM و Kerberos HTTP اضافه کنید، سازگاری پراکسی را بهبود بخشید، و دو روش اسکرین‌شات از راه دور ارائه دهید."""
